    <script>
      // Ensure trailing slash on GitHub Pages so relative paths (./assets/...) resolve inside the repository folder
      (function() {
        if (
          location.hostname.endsWith('github.io') &&
          location.pathname.length > 1 &&
          !location.pathname.endsWith('/') &&
          !location.pathname.endsWith('.html')
        ) {
          location.replace(location.pathname + '/' + location.search + location.hash);
        }
      })();
    </script>

  <body>
    <div id="root"></div>
    <script>
      // Fallback: If GitHub Pages serves the uncompiled repository root directly,
      // redirect seamlessly to the pre-compiled production build in /dist/
      (function() {
        if (
          location.hostname.endsWith('github.io') &&
          document.querySelector('script[src*="main.tsx"]')
        ) {
          var p = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
          location.replace(p + 'dist/' + location.search + location.hash);
        }
      })();
    </script>
